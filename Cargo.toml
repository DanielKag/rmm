[package]
name = "rmm"
version = "0.1.0"
edition = "2024"
description = "Fast parallel rm -rf with a live progress bar"
license = "MIT"
repository = "https://github.com/DanielKag/rmm"
readme = "README.md"
keywords = ["rm", "delete", "cli", "parallel"]
categories = ["command-line-utilities", "filesystem"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
clap = { version = "4", features = ["derive"] }
crossbeam-deque = "0.8.8"
indicatif = "0.18.6"
rustix = { version = "1", features = ["fs", "process", "termios"] }

[dev-dependencies]
tempfile = "3.27.0"
